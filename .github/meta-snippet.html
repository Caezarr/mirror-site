<!-- 
  Open Graph / Twitter Card meta defaults for Mirror public pages
  
  Usage: Copy and customize the placeholders below for each page:
  - {{PAGE_TITLE}} — page-specific title (e.g., "Privacy Policy — Mirror")
  - {{PAGE_DESCRIPTION}} — page-specific description
  - {{PAGE_PATH}} — relative path from site root (e.g., "privacy/")
  
  Base URL: https://caezarr.github.io/mirror-site/
  Default OG image: https://caezarr.github.io/mirror-site/og.png
-->

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://caezarr.github.io/mirror-site/{{PAGE_PATH}}">
<meta property="og:site_name" content="Mirror">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:image" content="https://caezarr.github.io/mirror-site/og.png">
<meta property="og:image:alt" content="Mirror — Local-first macOS workflow assistant">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="https://caezarr.github.io/mirror-site/og.png">
<meta name="twitter:image:alt" content="Mirror — Local-first macOS workflow assistant">
